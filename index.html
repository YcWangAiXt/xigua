<meta name="mobile-web-app-capable" content="yes">

<title>合成大西瓜</title>

<style>
  :root{
    --ink:#33251c;
    --ink-soft:#8b7861;
    --paper:#fdf4e3;
    --paper-deep:#f7e8cd;
    --card:#fffbf2;
    --edge:#e0ccab;
    --wood:#b9946a;
    --accent:#e8502e;
    --gold:#e2a72c;
    --danger:#d2504a;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    touch-action:none;
    user-select:none;-webkit-user-select:none;
  }
  #app{
    height:100vh;height:100dvh;
    max-width:540px;margin:0 auto;
    display:flex;flex-direction:column;
    padding:calc(var(--safe-top) + 6px) 14px calc(var(--safe-bottom) + 8px);
    gap:5px;
    background:
      radial-gradient(120% 78% at 50% -14%, #fffdf6 0%, rgba(255,253,246,0) 62%),
      linear-gradient(180deg,#fdf4e3 0%,#fbecd3 100%);
  }
  /* ---------- 顶栏 ---------- */
  #hud{display:flex;align-items:center;gap:8px;padding:2px 2px 0;}
  #brand{font-size:17px;font-weight:700;letter-spacing:.4px;flex:1;}
  #brand small{display:block;font-size:10.5px;font-weight:500;color:var(--ink-soft);letter-spacing:1.2px;margin-top:1px;}
  #fsBtn{
    appearance:none;border:1px solid var(--wood);background:rgba(255,251,242,.9);
    color:#6f5232;font-size:13px;font-weight:600;
    min-width:52px;min-height:44px;
    padding:0 12px;border-radius:11px;font-family:inherit;
  }
  #fsBtn:active{background:#f3e4c8;}
  #sndBtn{
    appearance:none;border:1px solid var(--wood);background:rgba(255,251,242,.9);
    width:44px;height:44px;min-width:44px;padding:0;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
  }
  #sndBtn:active{background:#f3e4c8;}
  #sndBtn.muted{background:#f0e2c6;}
  #sndBtn.muted #sndWave1,#sndBtn.muted #sndWave2{display:none;}
  #sndBtn:not(.muted) #sndMute{display:none;}
  /* ---------- 分数行 ---------- */
  #scoreRow{display:flex;align-items:flex-end;gap:10px;padding:0 2px;}
  #score{
    font-size:38px;font-weight:800;line-height:.92;color:var(--accent);
    font-variant-numeric:tabular-nums;letter-spacing:-.5px;
    text-shadow:0 2px 0 rgba(232,80,46,.10);
  }
  #best{flex:1;font-size:13px;color:#6f5232;font-weight:600;padding-bottom:5px;line-height:1.4;letter-spacing:.2px;}
  #best b{color:var(--accent);font-weight:700;font-size:14px;}
  #nextWrap{display:flex;align-items:center;gap:10px;padding-bottom:2px;}
  #nextWrap span{font-size:12px;color:var(--ink-soft);font-weight:600;}
  #nextCv{width:42px;height:42px;display:block;}
  /* ---------- 棋盘 ---------- */
  #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  #board{display:block;touch-action:none;border-radius:0;background:transparent;}
  /* ---------- 道具条 ---------- */
  #bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .prop{
    appearance:none;font-family:inherit;position:relative;
    display:flex;align-items:center;gap:6px;min-height:52px;
    padding:9px 9px;border-radius:13px;
    border:1.5px solid var(--edge);background:var(--card);
    box-shadow:0 1px 0 rgba(120,90,50,.06);
    transition:transform .1s ease,border-color .15s ease,background .15s ease;
  }
  .prop .ico{width:26px;height:26px;flex:0 0 26px;}
  .prop .nm{font-size:14px;font-weight:600;color:var(--ink);flex:1;text-align:left;white-space:nowrap;}
  .prop .ct{font-size:12px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .prop[data-n="0"]{opacity:.42;}
  .prop[data-n="0"] .ico{filter:grayscale(.55);}
  .prop.aim{border-color:var(--danger);background:#fff2ef;}
  .prop.aim .nm{color:#c93a3a;}
  .prop:active{transform:scale(.97);}
  /* ---------- 底注 ---------- */
  #hint{
    margin:0 2px;font-size:13px;color:var(--ink-soft);text-align:center;
    letter-spacing:.2px;line-height:1.5;
  }
  /* ---------- 覆盖层 ---------- */
  #mask{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(46,32,20,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    padding:24px;z-index:9;
  }
  #mask.on{display:flex;}
  .panel{
    width:min(330px,86vw);background:var(--card);border-radius:18px;
    border:1px solid var(--edge);padding:22px 20px 18px;text-align:center;
    box-shadow:0 18px 46px rgba(60,40,20,.22);
  }
  .panel h2{margin:0 0 6px;font-size:20px;letter-spacing:.5px;}
  .panel p{margin:0 0 16px;font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
  .panel .big{font-size:30px;font-weight:800;color:var(--accent);margin:2px 0 10px;font-variant-numeric:tabular-nums;}
  .panel button{
    appearance:none;font-family:inherit;border:0;border-radius:12px;
    background:var(--accent);color:#fff;font-size:14px;font-weight:700;
    padding:12px 26px;box-shadow:0 3px 0 #b73a1e;
  }
  .panel button:active{transform:translateY(1px);box-shadow:0 2px 0 #b73a1e;}
  #toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-bottom) + 96px);
    background:rgba(51,37,28,.9);color:#fff5e3;font-size:12px;font-weight:600;
    padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .22s ease;pointer-events:none;z-index:20;
  }
  #toast.on{opacity:1;}
</style>
</head>

<script>
/* ============================================================
   合成大西瓜 · iOS 手机版
   逻辑坐标固定 480×690，渲染按设备宽度等比缩放
   ============================================================ */
'use strict';
const LW = 480, LH = 648;                 // 逻辑画布
const BOX_L = 24, BOX_R = 456;            // 棋盘左右（贴到画布边，手机多留空间）
const BOX_T = 84, BOX_B = 620;            // 棋盘上下
const WARN_Y = BOX_T;                     // 危险线 = 框顶：水果碰到框顶就判负
const MAX_LV = 11;

// 物理参数（与电脑版一致）
const GRAVITY = 900, ITER = 3, SUB_DT = 1 / 120;
const WALL_REST = 0.18, WALL_FRIC = 0.90, REST = 0.05, FRIC = 0.16;
const MERGE_K = 1.02, DROP_COOL = 0.30, DANGER_LIMIT = 2.0;
const BOMB_REACH = 152, BOMB_AIM_R = 74;

// 11 级水果：色板 + 半径 + 分数
const LV = [
  { key:'grape',  name:'葡萄',    r:16,  score:1,   base:'#5b2e78', light:'#a180bd', dark:'#34184a', edge:'#1c0d28' },
  { key:'cherry', name:'樱桃',    r:21,  score:2,   base:'#c2162a', light:'#f47b84', dark:'#7d0d1c', edge:'#480710' },
  { key:'orange', name:'橘子',    r:27,  score:4,   base:'#e8791c', light:'#ffb463', dark:'#ab4d08', edge:'#6f3003' },
  { key:'lemon',  name:'柠檬',    r:34,  score:7,   base:'#ecd23a', light:'#fff5ab', dark:'#bfa114', edge:'#7e6a06' },
  { key:'kiwi',   name:'猕猴桃',  r:42,  score:11,  base:'#8b8f55', light:'#c8cb93', dark:'#565a2f', edge:'#33361a' },
  { key:'tomato', name:'西红柿',  r:51,  score:16,  base:'#d63a30', light:'#f78776', dark:'#961a15', edge:'#5d0c09' },
  { key:'peach',  name:'桃子',    r:61,  score:22,  base:'#f2a98c', light:'#ffdccb', dark:'#c87455', edge:'#8a452f' },
  { key:'pine',   name:'菠萝',    r:72,  score:29,  base:'#dda02c', light:'#fbd47f', dark:'#a67513', edge:'#6d4a07' },
  { key:'coco',   name:'椰子',    r:84,  score:37,  base:'#7e5a38', light:'#b98d61', dark:'#4f3520', edge:'#2c1b0e' },
  { key:'half',   name:'半个西瓜',r:96,  score:46,  base:'#dd4350', light:'#ff9aa1', dark:'#9c1f2c', edge:'#5e0f18' },
  { key:'melon',  name:'西瓜',    r:108, score:200, base:'#2f8b48', light:'#7ecb88', dark:'#1a5c2e', edge:'#0e371b' },
];
const SPAWN_POOL = [1,1,1,2,2,2,3,3,4,4,5];

/* ---------- 小工具 ---------- */
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const rand = (a,b) => a + Math.random() * (b - a);
const hex2rgba = (hex,a) => {
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
};

/* ---------- 水果贴图：球面光照 + 品种纹理 ---------- */
const DETAIL = {
  grape(c, cx, cy, R, cfg){
    // 霜白粉感
    for (let i = 0; i < 46; i++){
      const a = rand(0,6.283), d = R*Math.sqrt(Math.random())*0.94;
      const x = cx + Math.cos(a)*d, y = cy + Math.sin(a)*d;
      c.beginPath(); c.arc(x, y, rand(R*0.008, R*0.022), 0, 6.283);
      c.fillStyle = `rgba(238,230,246,${rand(0.10,0.30)})`; c.fill();
    }
    // 果梗
    c.beginPath(); c.moveTo(cx + R*0.02, cy - R*0.92);
    c.quadraticCurveTo(cx + R*0.10, cy - R*1.10, cx + R*0.24, cy - R*1.06);
    c.strokeStyle = '#6b5136'; c.lineWidth = Math.max(1, R*0.055); c.stroke();
  },
  cherry(c, cx, cy, R, cfg){
    c.beginPath(); c.moveTo(cx - R*0.04, cy - R*0.94);
    c.quadraticCurveTo(cx + R*0.16, cy - R*1.26, cx + R*0.44, cy - R*1.16);
    c.strokeStyle = '#6f5636'; c.lineWidth = Math.max(1, R*0.055); c.stroke();
    // 果顶小凹
    const g = c.createRadialGradient(cx - R*0.02, cy - R*0.72, 0, cx - R*0.02, cy - R*0.72, R*0.30);
    g.addColorStop(0,'rgba(60,8,14,.45)'); g.addColorStop(1,'rgba(60,8,14,0)');
    c.fillStyle = g; c.beginPath(); c.arc(cx - R*0.02, cy - R*0.72, R*0.30, 0, 6.283); c.fill();
  },
  orange(c, cx, cy, R, cfg){
    for (let i = 0; i < 260; i++){
      const a = rand(0,6.283), d = R*Math.sqrt(Math.random())*0.95;
      const x = cx + Math.cos(a)*d, y = cy + Math.sin(a)*d;
      c.beginPath(); c.arc(x, y, rand(R*0.006, R*0.018), 0, 6.283);
      c.fillStyle = `rgba(150,66,6,${rand(0.06,0.16)})`; c.fill();
    }
    // 绿蒂
    const t = c.createRadialGradient(cx, cy - R*0.86, 0, cx, cy - R*0.86, R*0.16);
    t.addColorStop(0,'#6f8f3a'); t.addColorStop(1,'rgba(80,110,40,0)');
    c.fillStyle = t; c.beginPath(); c.arc(cx, cy - R*0.86, R*0.16, 0, 6.283); c.fill();
  },
  lemon(c, cx, cy, R, cfg){
    for (let i = 0; i < 120; i++){
      const a = rand(0,6.283), d = R*Math.sqrt(Math.random())*0.92;
      c.beginPath();
      c.arc(cx + Math.cos(a)*d, cy + Math.sin(a)*d, rand(R*0.006, R*0.016), 0, 6.283);
      c.fillStyle = `rgba(146,120,10,${rand(0.05,0.14)})`; c.fill();
    }
    // 顶部小凸
    c.beginPath(); c.arc(cx, cy - R*0.94, R*0.10, 0, 6.283);
    c.fillStyle = 'rgba(255,248,180,.55)'; c.fill();
  },
  kiwi(c, cx, cy, R, cfg){
    for (let i = 0; i < 210; i++){
      const a = rand(0,6.283), d = R*Math.sqrt(Math.random())*0.95;
      const x = cx + Math.sin(a)*d, y = cy + Math.cos(a)*d;
      const len = rand(R*0.03, R*0.075);
      c.beginPath();
      c.moveTo(x, y); c.lineTo(x + rand(-2,2), y - len);
      c.strokeStyle = `rgba(58,52,30,${rand(0.10,0.26)})`;
      c.lineWidth = Math.max(0.6, R*0.012); c.stroke();
    }
  },
  tomato(c, cx, cy, R, cfg){
    // 顶部凹陷
    const g = c.createRadialGradient(cx, cy - R*0.66, 0, cx, cy - R*0.66, R*0.34);
    g.addColorStop(0,'rgba(90,10,8,.30)'); g.addColorStop(1,'rgba(90,10,8,0)');
    c.fillStyle = g; c.beginPath(); c.arc(cx, cy - R*0.66, R*0.34, 0, 6.283); c.fill();
    // 绿萼：五片尖叶
    c.save(); c.translate(cx, cy - R*0.80);
    for (let i = 0; i < 5; i++){
      c.beginPath();
      c.moveTo(0,0);
      c.lineTo(R*0.34, -R*0.10); c.lineTo(R*0.30, R*0.13);
      c.closePath();
      c.rotate(6.283/5);
      const lg = c.createLinearGradient(0,0,R*0.34,0);
      lg.addColorStop(0,'#4d7a2c'); lg.addColorStop(1,'#2f5620');
      c.fillStyle = lg; c.fill();
    }
    c.restore();
  },
  peach(c, cx, cy, R, cfg){
    // 中缝
    c.beginPath();
    c.moveTo(cx + R*0.06, cy - R*0.96);
    c.quadraticCurveTo(cx - R*0.10, cy, cx + R*0.10, cy + R*0.96);
    c.strokeStyle = 'rgba(150,72,52,.42)'; c.lineWidth = Math.max(1, R*0.035); c.stroke();
    // 绒感
    for (let i = 0; i < 160; i++){
      const a = rand(0,6.283), d = R*Math.sqrt(Math.random())*0.92;
      c.beginPath(); c.arc(cx + Math.cos(a)*d, cy + Math.sin(a)*d, rand(R*0.004, R*0.012), 0, 6.283);
      c.fillStyle = `rgba(255,238,224,${rand(0.05,0.16)})`; c.fill();
    }
    // 小叶片
    c.save(); c.translate(cx + R*0.24, cy - R*0.86); c.rotate(0.5);
    c.beginPath(); c.ellipse(0, 0, R*0.26, R*0.10, 0, 0, 6.283);
    const lg = c.createLinearGradient(-R*0.26,0,R*0.26,0);
    lg.addColorStop(0,'#4f7a2e'); lg.addColorStop(1,'#2f5a1d');
    c.fillStyle = lg; c.fill(); c.restore();
  },
  pine(c, cx, cy, R, cfg){
    // 菱形网格
    const step = R*0.30;
    c.strokeStyle = 'rgba(122,80,10,.34)'; c.lineWidth = Math.max(1, R*0.022);
    for (let k = -6; k <= 6; k++){
      c.beginPath();
      c.moveTo(cx - R*1.1, cy + k*step - R*1.1);
      c.lineTo(cx + R*1.1, cy + k*step + R*1.1);
      c.stroke();
      c.beginPath();
      c.moveTo(cx + R*1.1, cy + k*step - R*1.1);
      c.lineTo(cx - R*1.1, cy + k*step + R*1.1);
      c.stroke();
    }
    // 网格交叉点小刺
    c.fillStyle = 'rgba(90,58,4,.28)';
    for (let i = -3; i <= 3; i++){
      for (let j = -3; j <= 3; j++){
        const x = cx + (i+j)*step*0.5, y = cy + (i-j)*step*0.5;
        if ((x-cx)**2 + (y-cy)**2 > (R*0.98)**2) continue;
        c.beginPath(); c.arc(x, y, R*0.026, 0, 6.283); c.fill();
      }
    }
  },
  coco(c, cx, cy, R, cfg){
    // 三个棕眼
    const eyes = [[-0.16,-0.16],[0.14,-0.20],[0.02,0.04]];
    for (const [ex, ey] of eyes){
      const g = c.createRadialGradient(cx + R*ex, cy + R*ey, 0, cx + R*ex, cy + R*ey, R*0.13);
      g.addColorStop(0,'rgba(28,16,6,.75)'); g.addColorStop(1,'rgba(28,16,6,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(cx + R*ex, cy + R*ey, R*0.13, 0, 6.283); c.fill();
    }
    // 纤维
    for (let i = 0; i < 130; i++){
      const a = rand(0,6.283), d = R*Math.sqrt(Math.random())*0.94;
      const x = cx + Math.cos(a)*d, y = cy + Math.sin(a)*d;
      c.beginPath(); c.moveTo(x, y);
      c.quadraticCurveTo(x + rand(-6,6), y + rand(-6,6), x + rand(-10,10), y + rand(-10,10));
      c.strokeStyle = `rgba(46,28,12,${rand(0.05,0.16)})`;
      c.lineWidth = Math.max(0.6, R*0.010); c.stroke();
    }
  },
  half(c, cx, cy, R, cfg){
    // 切面：绿皮 + 白圈 + 红瓤 + 籽
    const faceR = R*0.72;
    c.beginPath(); c.arc(cx, cy, faceR*1.20, 0, 6.283);
    c.fillStyle = '#3f8f4f'; c.fill();               // 外层绿皮
    c.beginPath(); c.arc(cx, cy, faceR*1.06, 0, 6.283);
    c.fillStyle = '#f2f0d2'; c.fill();               // 白圈
    const g = c.createRadialGradient(cx - faceR*0.30, cy - faceR*0.34, 0, cx, cy, faceR);
    g.addColorStop(0,'#ff7b7f'); g.addColorStop(0.55,'#e03a44'); g.addColorStop(1,'#a81f2b');
    c.beginPath(); c.arc(cx, cy, faceR*0.94, 0, 6.283);
    c.fillStyle = g; c.fill();
    // 籽
    c.fillStyle = '#2b1512';
    const seeds = [[0,-0.42],[-0.42,-0.12],[0.42,-0.12],[-0.26,0.30],[0.26,0.30],[0,0.46]];
    for (const [sx, sy] of seeds){
      c.save();
      c.translate(cx + faceR*sx*0.8, cy + faceR*sy*0.8);
      c.rotate(sx*0.9);
      c.beginPath(); c.ellipse(0, 0, faceR*0.07, faceR*0.115, 0, 0, 6.283);
      c.fill(); c.restore();
    }
    // 切面高光
    c.beginPath(); c.arc(cx - faceR*0.26, cy - faceR*0.30, faceR*0.30, 0, 6.283);
    c.fillStyle = 'rgba(255,255,255,.16)'; c.fill();
  },
  melon(c, cx, cy, R, cfg){
    // 深绿条纹
    c.save();
    c.beginPath(); c.arc(cx, cy, R*0.99, 0, 6.283); c.clip();
    for (let i = 0; i < 9; i++){
      const t = i / 8;
      const x0 = cx - R + t*2*R;
      c.beginPath();
      c.moveTo(x0, cy - R);
      c.bezierCurveTo(x0 + R*0.22, cy - R*0.35, x0 - R*0.22, cy + R*0.35, x0, cy + R);
      const w = R*rand(0.05, 0.10);
      c.lineWidth = w;
      c.strokeStyle = 'rgba(20,72,34,.62)';
      c.stroke();
    }
    c.restore();
  }
};

/* 生成一颗水果的贴图（离屏 canvas，含球体光照） */
const SPRITE_SCALE = 2.4;
const sprites = {};
function makeSprite(level){
  const cfg = LV[level-1], r = cfg.r;
  const pad = Math.max(3, r*0.16);
  const size = Math.ceil((r + pad) * 2 * SPRITE_SCALE);
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const c = cv.getContext('2d');
  const cx = size/2, cy = size/2, R = r * SPRITE_SCALE;

  // 主体：球面渐变（左上受光）
  const g = c.createRadialGradient(cx - R*0.36, cy - R*0.42, R*0.06,
                                   cx - R*0.06, cy - R*0.04, R*1.16);
  g.addColorStop(0, cfg.light);
  g.addColorStop(0.30, hex2rgba(cfg.light, 0.86));
  g.addColorStop(0.62, cfg.base);
  g.addColorStop(0.90, cfg.dark);
  g.addColorStop(1, cfg.edge);
  c.beginPath(); c.arc(cx, cy, R, 0, 6.283); c.fillStyle = g; c.fill();

  // 品种纹理（限制在圆内）
  c.save();
  c.beginPath(); c.arc(cx, cy, R*0.995, 0, 6.283); c.clip();
  DETAIL[cfg.key](c, cx, cy, R, cfg);
  c.restore();

  // 环境遮蔽：下半部压暗
  const ao = c.createLinearGradient(0, cy, 0, cy + R);
  ao.addColorStop(0, 'rgba(28,16,10,0)');
  ao.addColorStop(1, 'rgba(28,16,10,.34)');
  c.save();
  c.beginPath(); c.arc(cx, cy, R*0.995, 0, 6.283); c.clip();
  c.fillStyle = ao; c.fillRect(0, cy, size, R);
  c.restore();

  // 边缘光（右上方）
  const rim = c.createRadialGradient(cx + R*0.30, cy - R*0.34, R*0.55,
                                     cx + R*0.30, cy - R*0.34, R*1.06);
  rim.addColorStop(0, 'rgba(255,250,236,0)');
  rim.addColorStop(0.86, 'rgba(255,250,236,.10)');
  rim.addColorStop(1, 'rgba(255,252,240,.30)');
  c.save();
  c.beginPath(); c.arc(cx, cy, R*0.995, 0, 6.283); c.clip();
  c.fillStyle = rim; c.fillRect(0, 0, size, size);
  c.restore();

  // 底部反射光
  const bounce = c.createRadialGradient(cx + R*0.10, cy + R*0.86, 0,
                                        cx + R*0.10, cy + R*0.86, R*0.74);
  bounce.addColorStop(0, 'rgba(255,238,206,.22)');
  bounce.addColorStop(1, 'rgba(255,238,206,0)');
  c.save();
  c.beginPath(); c.arc(cx, cy, R*0.995, 0, 6.283); c.clip();
  c.fillStyle = bounce; c.fillRect(0, 0, size, size);
  c.restore();

  // 主高光
  const hl = c.createRadialGradient(cx - R*0.34, cy - R*0.40, 0,
                                    cx - R*0.34, cy - R*0.40, R*0.44);
  hl.addColorStop(0, 'rgba(255,255,255,.62)');
  hl.addColorStop(0.30, 'rgba(255,255,255,.20)');
  hl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = hl;
  c.beginPath(); c.arc(cx - R*0.34, cy - R*0.40, R*0.44, 0, 6.283); c.fill();

  // 锐利小反光
  c.fillStyle = 'rgba(255,255,255,.78)';
  c.beginPath(); c.ellipse(cx - R*0.36, cy - R*0.44, R*0.085, R*0.055, -0.55, 0, 6.283); c.fill();

  // 轮廓：极细的暗边，避免"贴纸感"
  c.beginPath(); c.arc(cx, cy, R*0.995, 0, 6.283);
  c.strokeStyle = hex2rgba(cfg.edge, 0.36);
  c.lineWidth = Math.max(1, R*0.012); c.stroke();

  return cv;
}
for (let i = 1; i <= MAX_LV; i++) sprites[i] = makeSprite(i);

/* ============================================================
   绘制 & 游戏状态
   ============================================================ */
const board = document.getElementById('board');
const bctx = board.getContext('2d');
const nextCv = document.getElementById('nextCv');
const nctx = nextCv.getContext('2d');
const elScore = document.getElementById('score');
const elBest = document.getElementById('best');
const elBestNum = document.getElementById('bestNum');
const elMask = document.getElementById('mask');
const elPanel = document.getElementById('panel');
const elToast = document.getElementById('toast');

let S = 1, SK = 1;
const dpr = () => Math.min(window.devicePixelRatio || 1, 3);

function layout(){
  const stage = document.getElementById('stage');
  const aw = stage.clientWidth, ah = stage.clientHeight;
  if (aw < 40 || ah < 40) return false;
  const vwLimit = (window.innerWidth || aw) - 28;   // 别超出可视宽度
  S = Math.min(aw / LW, ah / LH, vwLimit / LW);
  SK = S * dpr();
  const cssW = Math.floor(LW * S), cssH = Math.floor(LH * S);
  board.style.width = cssW + 'px';
  board.style.height = cssH + 'px';
  board.width = Math.round(cssW * dpr());
  board.height = Math.round(cssH * dpr());
  bctx.setTransform(SK, 0, 0, SK, 0, 0);
  if (nextCv.width !== Math.round(42 * dpr())){
    nextCv.width = nextCv.height = Math.round(42 * dpr());
  }
  nctx.setTransform(dpr(), 0, 0, dpr(), 0, 0);
  drawNext();
  return true;
}

// 尺寸变化就重算（用逐帧比对，避免首次布局未完成时算错）
let _aw = 0, _ah = 0;
function keepLayout(){
  const stage = document.getElementById('stage');
  if (stage.clientWidth !== _aw || stage.clientHeight !== _ah){
    _aw = stage.clientWidth;
    _ah = stage.clientHeight;
    layout();
  }
}

/* 优先用内联的 3D 渲染贴图；图片未就绪时退回程序化贴图 */
const imgReady = {};
const fruitPad = lv => Math.max(3, LV[lv-1].r * (imgReady[lv] ? 0.042 : 0.16));

const imgMeta = {};   // lv -> { ar: 贴图高/宽, cy: 果心在贴图里的相对高度 }

function drawFruit(ctx, lv, x, y){
  const cfg = LV[lv-1];
  if (imgReady[lv]){
    const m = imgMeta[lv] || { ar: 1, cy: 0.5 };
    // 贴图宽度 = 球直径（放大到 1.03 倍让相邻水果贴得更紧），高度按原比例
    const w = cfg.r * 2 * 1.03;
    const h = w * m.ar;
    const top = y - m.cy * h;
    // 底部接触影，让堆叠更有前后层次
    ctx.save();
    ctx.globalAlpha = 0.13;
    ctx.fillStyle = '#3a2412';
    ctx.beginPath();
    ctx.ellipse(x, y + cfg.r * 0.70, cfg.r * 0.74, cfg.r * 0.24, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();
    ctx.drawImage(sprites[lv], x - w/2, top, w, h);
    return;
  }
  const pad = fruitPad(lv), w = (cfg.r + pad) * 2;
  ctx.drawImage(sprites[lv], x - w/2, y - w/2, w, w);
}

function drawNext(){
  nctx.clearRect(0, 0, 42, 42);
  const lv = G.nextLv;
  if (!lv) return;
  const im = sprites[lv];
  if (!im) return;
  if (imgReady[lv]){
    const m = imgMeta[lv] || { ar: 1, cy: 0.5 };
    let w = 32, h = w * m.ar;
    if (h > 36){ h = 36; w = h / m.ar; }
    nctx.drawImage(im, 21 - w/2, 21 - m.cy * h, w, h);
    return;
  }
  const cfg = LV[lv-1], pad = fruitPad(lv);
  const outer = cfg.r + pad;
  const k = 18 / outer;
  const w = outer * 2 * k;
  nctx.drawImage(im, 21 - w/2, 21 - w/2, w, w);
}

/* ---------- 状态 ---------- */
const G = {
  fruits: [], score: 0, best: 0, over: false,
  pending: null, nextLv: 0, cool: 0, mouseX: LW/2,
  props: { shake: 1, bomb: 1, star: 1 },
  aimMode: null, aimX: LW/2, aimY: (BOX_T+BOX_B)/2,
  bombs: [], effects: [],
  shakeT: 0, danger: 0, last: 0, acc: 0, running: false,
  comboT: 0, comboN: 0,
};

function newFruit(lv, x, y){
  const cfg = LV[lv-1];
  return { lv, x, y, vx: 0, vy: 0, r: cfg.r, m: cfg.r * cfg.r, landed: false };
}

// 待投放水果的高度：小水果悬在上方，大水果上边缘刚好贴到画布顶，不被裁
function pendingY(lv){
  const m = imgMeta[lv] || { ar: 1, cy: 0.5 };
  const h = LV[lv-1].r * 2 * 1.03 * m.ar;
  return Math.max(BOX_T - 54, m.cy * h - 2);
}

function spawnPending(){
  G.nextLv = G.nextLv || SPAWN_POOL[Math.floor(Math.random()*SPAWN_POOL.length)];
  const lv = G.nextLv;
  G.pending = newFruit(lv, clamp(G.mouseX, BOX_L + LV[lv-1].r, BOX_R - LV[lv-1].r), pendingY(lv));
  G.nextLv = SPAWN_POOL[Math.floor(Math.random()*SPAWN_POOL.length)];
  drawNext();
}

function drop(){
  if (G.over || G.cool > 0 || !G.pending) return;
  const f = G.pending;
  G.fruits.push(f);
  G.pending = null;
  G.cool = DROP_COOL;
  spawnPending();
  sfx('release', f.lv, f.x);   // 离手：极轻的一声，真正的落地声在接触时

}

/* ---------- 物理 ---------- */
function solveWalls(){
  for (const f of G.fruits){
    if (f.x - f.r < BOX_L){ f.x = BOX_L + f.r; if (f.vx < 0) f.vx = -f.vx * WALL_REST; }
    else if (f.x + f.r > BOX_R){ f.x = BOX_R - f.r; if (f.vx > 0) f.vx = -f.vx * WALL_REST; }
    if (f.y + f.r > BOX_B){
      f.y = BOX_B - f.r;
      if (f.vy > 0) f.vy = -f.vy * WALL_REST;
      f.vx *= WALL_FRIC;
    }
    if (f.y - f.r < BOX_T){
      f.y = BOX_T + f.r;
      if (f.vy < 0) f.vy = -f.vy * WALL_REST;
    }
  }
}

function mergePair(a, b){
  const F = G.fruits;
  const idxA = F.indexOf(a), idxB = F.indexOf(b);
  const lv = a.lv + 1;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const mvx = (a.vx + b.vx) / 2, mvy = (a.vy + b.vy) / 2;
  F.splice(Math.max(idxA, idxB), 1);
  F.splice(Math.min(idxA, idxB), 1);

  if (a.lv >= MAX_LV){
    G.score += LV[MAX_LV-1].score;
    addRipple(mx, my, 96, LV[MAX_LV-1].light);
    addText(mx, my, '+' + LV[MAX_LV-1].score, '#e8502e');
  } else {
    const f = newFruit(lv, mx, my);
    f.vx = mvx; f.vy = mvy;
    f.landed = true;
    F.push(f);
    G.score += LV[lv-1].score;
    addRipple(mx, my, LV[lv-1].r * 1.9, LV[lv-1].light);
    addText(mx, my, '+' + LV[lv-1].score, LV[lv-1].dark);
  }
  queueMerge(Math.min(MAX_LV, a.lv + 1), mx);
  bumpScore();
}

function solvePairs(){
  const F = G.fruits;
  // 1) 合并检测（每轮只并一对，避免数组变动）
  for (let i = 0; i < F.length; i++){
    for (let j = i+1; j < F.length; j++){
      const a = F[i], b = F[j];
      if (a.lv !== b.lv) continue;
      const dx = b.x-a.x, dy = b.y-a.y;
      const rr = a.r + b.r;
      if (dx*dx + dy*dy < (rr*MERGE_K) ** 2){ mergePair(a, b); return; }
    }
  }
  // 2) 分离 + 冲量
  for (let i = 0; i < F.length; i++){
    for (let j = i+1; j < F.length; j++){
      const a = F[i], b = F[j];
      const dx = b.x-a.x, dy = b.y-a.y;
      const rr = a.r + b.r;
      const d2 = dx*dx + dy*dy;
      if (d2 >= rr*rr || d2 < 1e-6) continue;
      const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
      const ov = (rr - d) * 0.5;
      a.x -= nx*ov; a.y -= ny*ov;
      b.x += nx*ov; b.y += ny*ov;
      const rel = (b.vx-a.vx)*nx + (b.vy-a.vy)*ny;
      if (rel < 0){
        const jimp = -(1 + REST) * rel / (1/a.m + 1/b.m);
        a.vx -= jimp*nx/a.m; a.vy -= jimp*ny/a.m;
        b.vx += jimp*nx/b.m; b.vy += jimp*ny/b.m;
        const tx = -ny, ty = nx;
        const rt = (b.vx-a.vx)*tx + (b.vy-a.vy)*ty;
        const jt = -rt * FRIC / (1/a.m + 1/b.m);
        a.vx -= jt*tx/a.m; a.vy -= jt*ty/a.m;
        b.vx += jt*tx/b.m; b.vy += jt*ty/b.m;
      }
    }
  }
}

function physics(dt){
  for (const f of G.fruits){
    f.pvy = f.vy;                       // 本步开始前的竖直速度，用来判断是否撞到东西
    f.vy += GRAVITY * dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
  }
  for (let k = 0; k < ITER; k++){
    solveWalls();
    solvePairs();
  }
  for (const f of G.fruits){
    if (Math.abs(f.vx) < 1.2) f.vx = 0;
    if (Math.abs(f.vy) < 1.2) f.vy = 0;
  }
  // 首次接触：下落被挡住的那一刻才是"落地声"，每颗水果只响一次
  for (const f of G.fruits){
    if (!f.landed && f.pvy > 55 && f.vy < f.pvy * 0.6){
      f.landed = true;
      dropSound(f.lv, f.x);
    }
  }
}

/* ---------- 特效 ---------- */
function addRipple(x, y, R, color){
  R = Math.min(116, R);
  G.effects.push({ kind:'ring', x, y, r0:R*0.28, grow:R*0.72, t:0, life:0.40, color });
}
function addText(x, y, text, color){
  G.effects.push({ kind:'text', x, y, text, color, t:0, life:0.85 });
}
function addSpark(x, y, n){
  for (let i = 0; i < n; i++){
    const a = rand(0, 6.283), sp = rand(140, 330);
    G.effects.push({
      kind:'spark', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      t:0, life:rand(0.35, 0.55),
      color:['#ff7a1f','#ffb020','#fff6e0'][i % 3],
    });
  }
}

function updateEffects(dt){
  const keep = [];
  for (const e of G.effects){
    e.t += dt;
    if (e.t >= e.life) continue;
    keep.push(e);
  }
  G.effects = keep;
}

/* ---------- 道具 ---------- */
function useProp(key){
  if (G.over || G.props[key] <= 0) return;
  if (key === 'bomb'){
    G.aimMode = (G.aimMode === 'bomb') ? null : 'bomb';
    if (G.aimMode) toast('点棋盘上的位置放炸弹');
    syncProps();
    return;
  }
  if (key === 'star'){
    if (!G.fruits.some(f => f.lv < MAX_LV)){ toast('没有可升级的水果'); return; }
    G.aimMode = (G.aimMode === 'star') ? null : 'star';
    if (G.aimMode) toast('点一颗水果，把它升一级');
    syncProps();
    return;
  }
  G.props[key]--;
  syncProps();
  if (key === 'shake'){
    for (const f of G.fruits){
      f.vx = rand(-520, 520);
      f.vy = rand(-430, -60);
    }
    G.shakeT = 0.34;
    addRipple((BOX_L+BOX_R)/2, BOX_B-40, 120, '#e8b060');
    sfx('shake');
  }
}

function placeBomb(x, y){
  if (G.props.bomb <= 0){ G.aimMode = null; syncProps(); return; }
  G.props.bomb--;
  G.aimMode = null;
  syncProps();
  const bx = clamp(x, BOX_L + 12, BOX_R - 12);
  const by = clamp(y, BOX_T + 12, BOX_B - 12);
  G.bombs.push({ x:bx, y:by, t:0.30 });
}

function placeStar(x, y){
  if (G.props.star <= 0){ G.aimMode = null; syncProps(); return; }
  let target = null, bestD = Infinity;
  for (const f of G.fruits){
    const d = (f.x - x) ** 2 + (f.y - y) ** 2;
    if (d < bestD){ bestD = d; target = f; }
  }
  if (!target || bestD > BOMB_REACH ** 2){
    toast('要点在一颗水果上');
    return;                                  // 没点中就不消耗，保持瞄准态
  }
  if (target.lv >= MAX_LV){ toast('西瓜已经是最大了'); return; }
  G.props.star--;
  G.aimMode = null;
  syncProps();
  target.lv += 1;
  const cfg = LV[target.lv-1];
  target.r = cfg.r; target.m = cfg.r * cfg.r;
  addRipple(target.x, target.y, cfg.r * 1.9, cfg.light);
  addText(target.x, target.y - cfg.r - 14, '升级！', '#b7791f');
  sfx('star', target.lv, target.x);
}

function explode(x, y){
  let victim = null, bestD = Infinity;
  for (const f of G.fruits){
    const d = (f.x-x)**2 + (f.y-y)**2;
    if (d < bestD){ bestD = d; victim = f; }
  }
  if (victim && bestD > BOMB_REACH**2) victim = null;
  if (victim) G.fruits.splice(G.fruits.indexOf(victim), 1);

  for (let i = 0; i < 2; i++){
    G.effects.push({ kind:'ring', x, y, r0:16 + i*8, grow:46 + i*18,
                     t:-i*0.05, life:0.40, color:i ? '#ffd07a' : '#ff8a2b' });
  }
  addSpark(x, y, 12);
  sfx('bomb', 0, x);
  G.shakeT = Math.max(G.shakeT, 0.18);
  addText(x, y - 24, victim ? '炸掉 1 个' : '附近没有水果', victim ? '#d2453a' : '#8b7861');
  syncProps();
}

function updateBombs(dt){
  const keep = [];
  for (const b of G.bombs){
    b.t -= dt;
    if (b.t <= 0){ explode(b.x, b.y); continue; }
    keep.push(b);
  }
  G.bombs = keep;
}

/* ---------- 音效引擎 ----------
   落下声 = 物理反馈：软、短、低存在感，随水果大小变化
   合成声 = 奖励反馈：亮、弹、五声音阶递进，等级越高压迫感与满足感越强
   全部 WebAudio 现场合成，不依赖任何音频文件
*/

let AC = null, BUS = null, BOOST = null, RVS = null, NOISEBUF = null;
let LAST_DROP = 0, PMERGE = null;
let MUTED = false, UNLOCK_TRIED = false;

// 整体电平：手机扬声器上 -17dB 几乎听不见，抬到 -10dB 左右
const LEVEL = 2.4;

function audioCtx(){
  if (!AC){
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try {
      AC = new C();
      BUS = AC.createGain();
      BUS.gain.value = 1;
      BOOST = AC.createGain();
      BOOST.gain.value = MUTED ? 0 : LEVEL;
      if (AC.createDynamicsCompressor){
        const cp = AC.createDynamicsCompressor();
        cp.threshold.value = -9;       // 只压过头的地方，别把正常声音一起压小
        cp.knee.value = 18;
        cp.ratio.value = 3;
        cp.attack.value = 0.005;
        cp.release.value = 0.15;
        BUS.connect(BOOST); BOOST.connect(cp); cp.connect(AC.destination);
      } else {
        BUS.connect(BOOST); BOOST.connect(AC.destination);
      }
    } catch(e){ AC = null; return null; }
  }
  if (AC.state === 'suspended'){ AC.resume().catch(function(){}); }
  return AC;
}

function jit(a, b){ return a + Math.random() * (b - a); }

// 合成位置 -> 轻微立体声
function dpan(x){
  return clamp(((x === undefined ? LW / 2 : x) / LW - 0.5) * 1.1, -0.85, 0.85);
}

// 轻量反馈式混响，给大水果一点尾巴
function reverbIn(){
  const a = audioCtx(); if (!a) return null;
  if (RVS) return RVS;
  const dl = a.createDelay(1.2);
  dl.delayTime.value = 0.048;
  const fb = a.createGain(); fb.gain.value = 0.46;
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
  const out = a.createGain(); out.gain.value = 0.28;
  dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(out);
  out.connect(BUS || a.destination);
  RVS = dl;
  return RVS;
}

function noiseBuffer(a){
  if (NOISEBUF && NOISEBUF.sampleRate === a.sampleRate) return NOISEBUF;
  const n = Math.floor(a.sampleRate * 1.0);
  const buf = a.createBuffer(1, n, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  NOISEBUF = buf;
  return buf;
}

// o = {freq, slideTo, dur, gain, type, attack, delay, pan, rev}
function tone(o){
  if (MUTED) return;
  const a = audioCtx(); if (!a) return;
  const t0 = a.currentTime + (o.delay || 0);
  const dur = o.dur || 0.15;
  const osc = a.createOscillator();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(Math.max(24, o.freq), t0);
  if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(24, o.slideTo), t0 + dur);
  const g = a.createGain();
  const peak = Math.max(0.0002, o.gain || 0.2);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.005));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = g;
  osc.connect(g);
  if (a.createStereoPanner){
    const p = a.createStereoPanner();
    p.pan.value = o.pan || 0;
    g.connect(p); node = p;
  }
  node.connect(BUS || a.destination);
  if (o.rev){ const R = reverbIn(); if (R){ const rg = a.createGain(); rg.gain.value = Math.min(1, o.rev); node.connect(rg); rg.connect(R); } }
  osc.start(t0); osc.stop(t0 + dur + 0.04);
}

// o = {dur, gain, hp|bp|q|lp, delay, pan, rev}
function noise(o){
  if (MUTED) return;
  const a = audioCtx(); if (!a) return;
  const t0 = a.currentTime + (o.delay || 0);
  const dur = o.dur || 0.06;
  const src = a.createBufferSource();
  src.buffer = noiseBuffer(a);
  const f = a.createBiquadFilter();
  if (o.bp){ f.type = 'bandpass'; f.frequency.value = o.bp; f.Q.value = o.q || 1.1; }
  else if (o.hp){ f.type = 'highpass'; f.frequency.value = o.hp; }
  else if (o.lp){ f.type = 'lowpass'; f.frequency.value = o.lp; }
  else { f.type = 'lowpass'; f.frequency.value = 6000; }
  const g = a.createGain();
  const peak = Math.max(0.0002, o.gain || 0.08);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = g;
  src.connect(f); f.connect(g);
  if (a.createStereoPanner){
    const p = a.createStereoPanner();
    p.pan.value = o.pan || 0;
    g.connect(p); node = p;
  }
  node.connect(BUS || a.destination);
  if (o.rev){ const R = reverbIn(); if (R){ const rg = a.createGain(); rg.gain.value = Math.min(1, o.rev); node.connect(rg); rg.connect(R); } }
  src.start(t0, Math.random() * 0.45, dur + 0.02);
}

// 五声音阶：等级映射音高，听得出"升一级"
const PENTA = [0, 2, 4, 7, 9];
function noteFreq(lv, shift){
  const i = clamp((lv || 1) - 1 + (shift || 0), 0, 22);
  const oct = Math.floor(i / 5);
  const semi = PENTA[i % 5] + oct * 12;
  return 130.81 * Math.pow(2, semi / 12);     // C3 起
}

/* ---- 落下声：软、短、可重复不烦 ---- */
function dropSound(lv, x){
  const a = audioCtx(); if (!a) return;
  // 限速：连续下落时不是每下都播
  if (a.currentTime - LAST_DROP < 0.10 && Math.random() > 0.4) return;
  LAST_DROP = a.currentTime;
  const r = LV[clamp(lv || 1, 1, MAX_LV) - 1].r;
  const big = clamp((r - 16) / (108 - 16), 0, 1);       // 0 小 .. 1 西瓜
  const pan = dpan(x);
  const vol = PMERGE ? 0.5 : 1;                          // 合成优先，落下让位
  const f0 = (198 - big * 62) * jit(0.94, 1.06);         // 音高 ±3~8%
  const dur = 0.045 + big * 0.07;                        // 45~115ms
  // 接触"噗"：低频闷响，随大小越长越厚
  tone({ freq: f0, slideTo: f0 * 0.7, dur: dur,
         gain: (0.061 + big * 0.042) * vol * jit(0.9, 1.1),
         type: 'sine', attack: 0.004, pan: pan });
  // 轻点：小水果更清脆，几乎无刺耳高频
  noise({ dur: 0.022 + big * 0.018,
          gain: (0.040 * (1 - big) + 0.0074) * vol * jit(0.9, 1.1),
          hp: 1500 + (1 - big) * 1500, pan: pan });
  // 果肉/水声：偶尔露出一点"多汁"
  if (Math.random() < 0.45)
    noise({ dur: 0.055, gain: (0.014 + big * 0.0116) * vol,
            bp: 640 + big * 260, q: 0.9, delay: 0.008, pan: pan });
  // 大水果多一层轻微弹跳"咕噜"
  if (big > 0.55 && Math.random() < 0.3)
    tone({ freq: f0 * 2.1, slideTo: f0 * 1.5, dur: 0.05,
           gain: 0.023 * vol, type: 'sine', delay: 0.05, pan: pan });
}

/* ---- 合成声：亮、弹、有递进 ---- */
function mergeSound(lv, x, combo){
  lv = clamp(lv || 1, 1, MAX_LV);
  const pan = lv >= MAX_LV ? 0 : dpan(x);                 // 大西瓜全屏化
  const f = noteFreq(lv, Math.min(2, combo || 0));        // combo 上行，但设上限避免尖锐

  if (lv <= 4){
    // 小：水滴 / 气泡，高频清脆
    tone({ freq: f * 0.75, slideTo: f * 1.9, dur: 0.10, gain: 0.25, type: 'sine', attack: 0.004, pan: pan });
    tone({ freq: f * 2, slideTo: f * 2.6, dur: 0.07, gain: 0.10, type: 'sine', delay: 0.03, pan: pan });
    noise({ dur: 0.05, gain: 0.045, bp: 1500, q: 1.4, pan: pan });
  } else if (lv <= 8){
    // 中：果冻弹 + 软木琴短和弦
    tone({ freq: f, slideTo: f * 1.22, dur: 0.17, gain: 0.25, type: 'triangle', pan: pan });
    tone({ freq: f * 1.26, dur: 0.14, gain: 0.15, type: 'triangle', delay: 0.035, pan: pan });
    tone({ freq: f * 1.5, dur: 0.12, gain: 0.11, type: 'triangle', delay: 0.07, pan: pan });
    noise({ dur: 0.05, gain: 0.028, bp: 520, q: 0.8, pan: pan });
  } else if (lv <= 10){
    // 大：低频 thump + 明亮泛音 + 短混响，厚重但仍有满足感
    tone({ freq: 80, slideTo: 52, dur: 0.26, gain: 0.28, type: 'sine', attack: 0.006, pan: pan });
    tone({ freq: f, slideTo: f * 1.12, dur: 0.28, gain: 0.23, type: 'triangle', pan: pan, rev: 0.5 });
    tone({ freq: f * 2, dur: 0.16, gain: 0.12, type: 'sine', delay: 0.02, pan: pan, rev: 0.4 });
    tone({ freq: f * 1.5, dur: 0.20, gain: 0.11, type: 'triangle', delay: 0.08, pan: pan, rev: 0.4 });
  } else {
    // 大西瓜：低频冲击 + 上行和弦 + 600~1000ms 混响尾巴
    tone({ freq: 62, slideTo: 44, dur: 0.45, gain: 0.32, type: 'sine', attack: 0.008 });
    tone({ freq: f, dur: 0.34, gain: 0.21, type: 'triangle', pan: 0, rev: 1 });
    tone({ freq: f * 1.26, dur: 0.34, gain: 0.17, type: 'triangle', delay: 0.055, pan: 0, rev: 1 });
    tone({ freq: f * 1.5, dur: 0.40, gain: 0.15, type: 'triangle', delay: 0.11, pan: 0, rev: 1 });
    tone({ freq: f * 2, dur: 0.42, gain: 0.12, type: 'sine', delay: 0.16, pan: 0, rev: 1 });
    noise({ dur: 0.10, gain: 0.045, bp: 900, q: 0.7, rev: 0.6 });
  }
}

/* ---- 其他动作 ---- */
function bombSound(x){
  const pan = dpan(x);
  // 软果冻爆开，不做爆炸/金属感
  tone({ freq: 128, slideTo: 52, dur: 0.18, gain: 0.23, type: 'sine', pan: pan });
  noise({ dur: 0.14, gain: 0.095, bp: 780, q: 0.6, pan: pan });
  noise({ dur: 0.07, gain: 0.05, hp: 2600, delay: 0.02, pan: pan });
  if (Math.random() < 0.5) noise({ dur: 0.06, gain: 0.028, bp: 400, delay: 0.05, pan: pan });
}

function shakeSound(){
  // 一串短促"咕噜"，不是一声长噪声
  for (let i = 0; i < 4; i++){
    tone({ freq: 150 + i * 22, slideTo: 105 + i * 16, dur: 0.07,
           gain: Math.max(0.018, 0.055 - i * 0.009), type: 'sine',
           delay: i * 0.055, pan: Math.sin(i * 1.7) * 0.42 });
    noise({ dur: 0.045, gain: 0.018, hp: 900, delay: i * 0.055 });
  }
}

function starSound(lv, x){
  const pan = dpan(x);
  const f = noteFreq(clamp(lv || 1, 1, MAX_LV), 0);
  tone({ freq: f * 0.9, slideTo: f * 1.7, dur: 0.12, gain: 0.19, type: 'sine', pan: pan });
  tone({ freq: f * 1.5, dur: 0.10, gain: 0.13, type: 'triangle', delay: 0.06, pan: pan, rev: 0.5 });
  tone({ freq: f * 2, dur: 0.12, gain: 0.11, type: 'sine', delay: 0.12, pan: pan, rev: 0.5 });
  noise({ dur: 0.05, gain: 0.028, bp: 1800, delay: 0.02, pan: pan });
}

function overSound(){
  const seq = [392, 311, 233];
  for (let i = 0; i < seq.length; i++){
    tone({ freq: seq[i], slideTo: seq[i] * 0.94, dur: 0.24, gain: 0.15,
           type: 'triangle', delay: i * 0.13, rev: 0.45 });
  }
}

// 点击喇叭时的确认音：一听就知道有没有声
function testSound(){
  if (MUTED) return;
  tone({ freq: 660, dur: 0.10, gain: 0.30, type: 'triangle', rev: 0.4 });
  tone({ freq: 990, dur: 0.15, gain: 0.22, type: 'sine', delay: 0.07, rev: 0.5 });
  noise({ dur: 0.05, gain: 0.03, bp: 1600, q: 1.2 });
}

function applyMute(){
  const btn = document.getElementById('sndBtn');
  if (btn) btn.classList.toggle('muted', MUTED);
  if (BOOST) BOOST.gain.value = MUTED ? 0 : LEVEL;
  try { localStorage.setItem('xigua_mute', MUTED ? '1' : '0'); } catch(e){}
}

// 任何一次触摸都尝试解锁（iOS 要求手势内 resume）
function unlockAudio(){
  const a = audioCtx();
  if (!a) return;
  if (a.state !== 'running') a.resume().catch(function(){});
  if (!UNLOCK_TRIED){
    UNLOCK_TRIED = true;
    setTimeout(function(){
      const x = AC;
      if (x && x.state !== 'running' && !MUTED)
        toast('声音没启动：请再点一下屏幕，并检查手机左侧静音开关');
    }, 900);
  }
}

function sfx(name, lv, x){
  if (name === 'drop') dropSound(lv, x);
  else if (name === 'release'){
    tone({ freq: 330 + jit(-18, 18), slideTo: 185, dur: 0.055, gain: 0.035,
           type: 'sine', attack: 0.004, pan: dpan(x) });
  } else if (name === 'test'){
    testSound();
  }
  else if (name === 'merge') mergeSound(lv, x, 0);
  else if (name === 'bomb') bombSound(x);
  else if (name === 'shake') shakeSound();
  else if (name === 'star') starSound(lv, x);
  else if (name === 'over') overSound();
}

/* ---- 同帧多个合成只播最高等级 ---- */
function queueMerge(lv, x){
  if (!PMERGE || lv > PMERGE.lv) PMERGE = { lv: lv, x: x };
}

function flushMerge(){
  if (!PMERGE) return;
  const q = PMERGE; PMERGE = null;
  const t = (typeof performance !== 'undefined' ? performance.now() : Date.now()) / 1000;
  if (t - (G.comboT || 0) < 0.55) G.comboN = Math.min(3, (G.comboN || 0) + 1);
  else G.comboN = 0;
  G.comboT = t;
  mergeSound(q.lv, q.x, G.comboN);
}

/* ---------- 渲染 ---------- */
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawBoard(){
  const c = bctx;
  // 外框（木色）
  c.save();
  roundRect(c, BOX_L - 7, BOX_T - 7, (BOX_R-BOX_L) + 14, (BOX_B-BOX_T) + 14, 10);
  const fg = c.createLinearGradient(0, BOX_T, 0, BOX_B);
  fg.addColorStop(0, '#c6a173');
  fg.addColorStop(1, '#ab8558');
  c.fillStyle = fg; c.fill();
  c.restore();
  // 内底
  c.save();
  roundRect(c, BOX_L, BOX_T, BOX_R-BOX_L, BOX_B-BOX_T, 6);
  c.fillStyle = '#fffcf4'; c.fill();
  // 底部内侧暖影
  const ig = c.createLinearGradient(0, BOX_B - 60, 0, BOX_B);
  ig.addColorStop(0, 'rgba(200,168,120,0)');
  ig.addColorStop(1, 'rgba(200,168,120,.12)');
  c.fillStyle = ig; c.fillRect(BOX_L, BOX_B - 60, BOX_R-BOX_L, 60);
  c.restore();
  // 危险线
  const danger = G.danger > 0.25;
  c.save();
  c.setLineDash([6, 5]);
  c.strokeStyle = danger ? 'rgba(214,80,74,.9)' : 'rgba(214,80,74,.38)';
  c.lineWidth = danger ? 2 : 1.2;
  c.beginPath(); c.moveTo(BOX_L + 6, WARN_Y); c.lineTo(BOX_R - 6, WARN_Y); c.stroke();
  c.restore();
}

function drawPending(){
  const p = G.pending;
  if (!p) return;
  const c = bctx;
  // 瞄准虚线
  c.save();
  c.setLineDash([4, 6]);
  c.strokeStyle = 'rgba(120,96,66,.34)';
  c.lineWidth = 1;
  c.beginPath(); c.moveTo(p.x, p.y + p.r + 4); c.lineTo(p.x, BOX_B); c.stroke();
  c.restore();
  drawFruit(c, p.lv, p.x, p.y);
}

function drawBombAid(){
  if (!G.aimMode) return;
  const isBomb = G.aimMode === 'bomb';
  const c = bctx;
  const r = BOMB_AIM_R;
  const cx = clamp(G.aimX, BOX_L + r*0.4, BOX_R - r*0.4);
  const cy = clamp(G.aimY, BOX_T + r*0.4, BOX_B - r*0.4);
  const ring = isBomb ? '214,80,74' : '198,146,36';
  c.save();
  c.strokeStyle = 'rgba(' + ring + ',.78)';
  c.lineWidth = 1.8;
  c.beginPath(); c.arc(cx, cy, r, 0, 6.283); c.stroke();
  c.strokeStyle = 'rgba(' + ring + ',.28)';
  c.lineWidth = 6;
  c.beginPath(); c.arc(cx, cy, r, 0, 6.283); c.stroke();
  // 十字
  c.strokeStyle = 'rgba(' + ring + ',.55)';
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(cx - 9, cy); c.lineTo(cx + 9, cy);
  c.moveTo(cx, cy - 9); c.lineTo(cx, cy + 9);
  c.stroke();
  c.restore();
  // 提示文字
  c.save();
  c.font = '600 11px -apple-system,"PingFang SC",sans-serif';
  c.fillStyle = isBomb ? '#c93a3a' : '#a97612';
  c.textAlign = 'center';
  c.fillText(isBomb ? '点哪炸哪 · 只炸 1 个' : '点哪升哪 · 只升 1 个', cx, cy - r - 8);
  c.restore();
}

function drawBombs(){
  for (const b of G.bombs){
    const c = bctx;
    const pu = 1 + Math.sin((0.30 - b.t) * 30) * 0.06;
    c.save();
    c.beginPath(); c.arc(b.x, b.y, 11 * pu, 0, 6.283);
    c.fillStyle = '#2c2c34'; c.fill();
    c.strokeStyle = '#17171c'; c.lineWidth = 1.4; c.stroke();
    c.beginPath(); c.arc(b.x - 3.5, b.y - 4, 3.4, 0, 6.283);
    c.fillStyle = '#8e909c'; c.fill();
    c.restore();
  }
}

function drawEffects(){
  const c = bctx;
  for (const e of G.effects){
    const p = e.t / e.life;
    if (e.kind === 'ring'){
      const rad = e.r0 + e.grow * p;
      c.save();
      c.globalAlpha = Math.max(0, 1 - p);
      c.strokeStyle = e.color;
      c.lineWidth = Math.max(1, (1 - p) * 3.2 + 0.8);
      c.beginPath(); c.arc(e.x, e.y, rad, 0, 6.283); c.stroke();
      c.restore();
    } else if (e.kind === 'text'){
      c.save();
      c.globalAlpha = Math.max(0, 1 - p * p);
      c.font = '700 13px -apple-system,"PingFang SC",sans-serif';
      c.textAlign = 'center';
      c.fillStyle = e.color;
      c.fillText(e.text, e.x, e.y - 32 * p);
      c.restore();
    } else if (e.kind === 'spark'){
      const x = e.x + e.vx * e.t, y = e.y + e.vy * e.t + 120 * e.t * e.t;
      c.save();
      c.globalAlpha = Math.max(0, 1 - p);
      c.fillStyle = e.color;
      c.beginPath(); c.arc(x, y, Math.max(1.2, 3.2 * (1 - p)), 0, 6.283); c.fill();
      c.restore();
    }
  }
}

function render(dt){
  const c = bctx;
  c.clearRect(0, 0, LW, LH);
  let ox = 0, oy = 0;
  if (G.shakeT > 0){
    const t = G.shakeT, amp = 7 * (t / 0.34);
    ox = Math.sin(t * 46) * amp;
    oy = Math.cos(t * 38) * amp * 0.7;
  }
  c.save();
  c.translate(ox, oy);
  drawBoard();
  // 水果按大小排序，小的在上面更自然
  // 水果只在内框范围内显示：左右和下边被框收住，顶部保持开口
  c.save();
  c.beginPath();
  c.rect(BOX_L - 1, BOX_T - 130, (BOX_R - BOX_L) + 2, (BOX_B - BOX_T) + 132);
  c.clip();
  for (const f of G.fruits) drawFruit(c, f.lv, f.x, f.y);
  c.restore();
  drawBombs();
  drawEffects();
  drawBombAid();
  if (!G.over) drawPending();
  c.restore();
  // 危险提示
  if (G.danger > 0.25 && !G.over){
    c.save();
    c.font = '700 12px -apple-system,"PingFang SC",sans-serif';
    c.textAlign = 'center';
    c.fillStyle = 'rgba(214,80,74,.85)';
    c.fillText('空间快满了！', LW/2, WARN_Y - 12);
    c.restore();
  }
}

/* ---------- 主循环 ---------- */
function tick(now){
  const dt = Math.min(0.05, (now - (G.last || now)) / 1000);
  G.last = now;
  keepLayout();
  if (!G.over){
    G.acc += dt;
    while (G.acc >= SUB_DT){
      physics(SUB_DT);
      updateBombs(SUB_DT);
      G.acc -= SUB_DT;
    }
    if (G.cool > 0) G.cool -= dt;
    if (G.shakeT > 0) G.shakeT -= dt;
    updateEffects(dt);
    // 危险线判负
    let danger = false;
    for (const f of G.fruits){
      if (f.y - f.r < WARN_Y + 5 && Math.abs(f.vx) < 70 && Math.abs(f.vy) < 70){ danger = true; break; }
    }
    G.danger = danger ? G.danger + dt : Math.max(0, G.danger - dt * 1.6);
    if (G.danger > DANGER_LIMIT) gameOver();
    // 待投放水果跟手指
    if (G.pending){
      const cfg = LV[G.pending.lv-1];
      G.pending.x = clamp(G.mouseX, BOX_L + cfg.r, BOX_R - cfg.r);
      G.pending.y = pendingY(G.pending.lv);
    }
  } else {
    updateEffects(dt);
    if (G.shakeT > 0) G.shakeT -= dt;
  }
  flushMerge();
  render(dt);
  requestAnimationFrame(tick);
}

/* ---------- 开局 / 结束 ---------- */
function gameOver(){
  if (G.over) return;
  G.over = true;
  G.aimMode = null;
  bumpScore();
  sfx('over');
  showPanel();
}

function showPanel(){
  elPanel.innerHTML = `
    <h2>这局结束了</h2>
    <div class="big">${G.score}</div>
    <p>最高分 ${G.best}</p>
    <button type="button" id="again">再来一局</button>`;
  elMask.classList.add('on');
  document.getElementById('again').addEventListener('click', reset);
}

function reset(){
  elMask.classList.remove('on');
  G.fruits = [];
  G.score = 0;
  G.over = false;
  G.props = { shake:1, bomb:1, star:1 };
  G.aimMode = null;
  G.bombs = [];
  G.effects = [];
  G.danger = 0;
  G.cool = 0;
  G.shakeT = 0;
  G.nextLv = 0;
  G.mouseX = LW / 2;
  elScore.textContent = '0';
  syncProps();
  spawnPending();
}

/* ---------- 输入 ---------- */
function toLogic(ev){
  const rect = board.getBoundingClientRect();
  const x = (ev.clientX - rect.left) / (rect.width / LW);
  const y = (ev.clientY - rect.top) / (rect.height / LH);
  return { x, y };
}

board.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  if (G.over) return;
  audioCtx();                       // 首次触摸时解锁音频
  const p = toLogic(ev);
  G.mouseX = clamp(p.x, BOX_L + 10, BOX_R - 10);
  G.aimX = p.x; G.aimY = p.y;
  board.setPointerCapture(ev.pointerId);
}, { passive: false });

board.addEventListener('pointermove', ev => {
  if (G.over) return;
  const p = toLogic(ev);
  if (ev.buttons || ev.pointerType === 'touch'){
    G.mouseX = clamp(p.x, BOX_L + 10, BOX_R - 10);
    if (G.aimMode){ G.aimX = p.x; G.aimY = p.y; }
  }
}, { passive: false });

board.addEventListener('pointerup', ev => {
  ev.preventDefault();
  if (G.over) return;
  const p = toLogic(ev);
  if (p.x < BOX_L - 20 || p.x > BOX_R + 20 || p.y < BOX_T - 60 || p.y > BOX_B + 20) return;
  if (G.aimMode === 'bomb'){ placeBomb(p.x, p.y); return; }
  if (G.aimMode === 'star'){ placeStar(p.x, p.y); return; }
  G.mouseX = clamp(p.x, BOX_L + 10, BOX_R - 10);
  drop();
}, { passive: false });

board.addEventListener('pointercancel', ev => { /* 忽略 */ }, { passive: true });

document.querySelectorAll('.prop').forEach(btn => {
  btn.addEventListener('click', () => {
    const k = btn.dataset.key;
    if (G.props[k] <= 0){ toast('这个道具已经用完了'); return; }
    useProp(k);
  });
});

try {
  if (localStorage.getItem('xigua_mute') === '1') MUTED = true;
} catch(e){}
applyMute();

document.getElementById('sndBtn').addEventListener('click', function(){
  MUTED = !MUTED;
  applyMute();
  if (!MUTED){
    unlockAudio();
    testSound();
  }
});

['pointerdown', 'touchstart', 'click', 'keydown'].forEach(function(ev){
  document.addEventListener(ev, unlockAudio, { passive: true });
});

document.getElementById('fsBtn').addEventListener('click', () => {
  const el = document.documentElement;
  if (el.requestFullscreen){
    if (!document.fullscreenElement) el.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  } else {
    toast('iPhone 请用「分享 → 添加到主屏幕」全屏');
  }
});

window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 260));
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* ---------- 启动 ---------- */
try { G.best = parseInt(localStorage.getItem('xigua_best_ios') || '0', 10) || 0; } catch(e){}
elBestNum.textContent = String(G.best);
layout();
reset();

/* 3D 贴图解码完成后接管水果绘制 */
(function loadAtlas(){
  const imgs = Array.from(document.querySelectorAll('#fruitAtlas img[data-lv]'));
  if (!imgs.length) return;
  imgs.forEach(function(im){
    const lv = +im.dataset.lv;
    const done = function(){
      if (im.naturalWidth > 0){
        sprites[lv] = im;
        imgReady[lv] = true;
        const cy = parseFloat(im.dataset.cy);
        imgMeta[lv] = { ar: im.naturalHeight / im.naturalWidth, cy: isNaN(cy) ? 0.5 : cy };
      }
    };
    if (im.complete && im.naturalWidth > 0) done();
    else im.addEventListener('load', done, { once:true });
  });
  setTimeout(drawNext, 80);
})();

requestAnimationFrame(tick);

</script>
